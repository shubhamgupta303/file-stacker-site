<head>

<title>File Stacker — Mac App Store</title>

<meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6816327919">

<script>location.replace("https://apps.apple.com/app/id6816327919")</script>
<style>
  :root { color-scheme: light dark; --ink: #18213a; --muted: #56607a; --paper: #f7f6f2; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eef0f6; --muted: #a9b0c4; --paper: #121726; --accent: #7aa7f5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 28px; margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.button { display: inline-block; padding: 12px 22px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  a.button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  footer { margin-top: 40px; font-size: 14px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>File Stacker</h1>
  <p>Opening the Mac App Store…</p>

  <footer><a href="support.html">Support</a> · <a href="privacy.html">Privacy</a></footer>
</main>
</body>
</html>
